services:

  mysql:
    image: mysql:8.0
    container_name: offline_sync_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: offline_sync_db
      MYSQL_USER: offline_user
      MYSQL_PASSWORD: offline_password

    ports:
      - "3308:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: offline_sync_redis
    restart: unless-stopped

    ports:
      - "6380:6379"

    volumes:
      - redis_data:/data


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: offline_sync_backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: mysql+pymysql://offline_user:offline_password@mysql:3306/offline_sync_db
      REDIS_URL: redis://redis:6379/0

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: offline_sync_frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:
  mysql_data:
  redis_data: